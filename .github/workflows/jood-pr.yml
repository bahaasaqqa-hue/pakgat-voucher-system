name: Jood PR Verification

on:
  pull_request:
    branches:
      - gce-migration
    paths:
      - 'app/**/*.py'
      - 'main.py'
      - 'tests/**/*.py'
      - 'requirements.txt'
      - 'deploy/gce/install-ai-company.sh'
      - '.github/workflows/jood-pr.yml'
  push:
    branches:
      - 'gce-migration'
      - 'feat/jood-company-ai-omnichannel'
      - 'fix-jood-*'

jobs:
  verify-jood:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      ADMIN_PASSWORD: test-only-password
      ADMIN_SECRET: test-only-admin-secret
      PUBLIC_BASE_URL: https://example.test
      WHATSLOOP_API_BASE_URL: https://example.test/api/v1
      WHATSLOOP_API_TOKEN: test-only-whatsloop-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Production code uses PEP 701 f-string parsing (Python 3.12+).
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile application modules
        run: python -m compileall -q main.py app

      - name: Import full application
        run: python -c "import main; print('ROUTES=' + str(len(main.app.routes)))"

      - name: Run full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
